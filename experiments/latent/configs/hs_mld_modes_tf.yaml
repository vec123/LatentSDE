# Self-contained. The frozen MLD latents as z (experiments/latent/hs_mld.py, 30 values: exam 8, photo 10, ultrasound 4, serum 8),
# a forward SDE-matching posterior, and
#  - a TRANSFORMER drift f(z, mu, u): each latent dimension is a token, plus a token for the covariates mu (38) and one for the
#    treatment u; self-attention lets the latent dimensions attend to each other (src/latent/transformer.py);
#  - the MODE as before (src/latent/modes.py): pi(c | mu, summary of the posterior path m(t)) times the exact evidence of all
#    visits, c = argmax; c acts on the observations through the block-wise decoder z_m + MLP_m([z_m, c]) (each modality's block reads only itself) (starts at the identity, fixed noise
#    0.3); the drift and the posterior network do not read c; balance 0.5 keeps every mode in use.
# input_dropout: modality dropout of the posterior's input (the reconstruction still counts the dropped blocks).
name: hs_mld_modes_tf
seed: 0
data:
  train: {source: hs_mld, split: train, covariates: all}
  val: {source: hs_mld, split: val, covariates: all}
  test: {source: hs_mld, split: test, covariates: all}
model:
  dim_z: 30
  dim_mu: 38
  dim_u: 7
  encoder: {type: none}
  decoder: {type: residual, hidden: [64], std_fixed: 0.3, sizes: [8, 10, 4, 8]}
  posterior: {type: sequence, hidden: 64, bidirectional: false, forward_only: true}
  drift: {type: transformer, d_model: 64, n_layers: 2, n_heads: 4}
  mode_head: {n: 4, hidden: [64], balance: 0.5}
  diffusion: {type: constant}
  g_init: 0.3
  n_samples: 4
  n_quad: 32
  input_dropout: {p: 0.25, sizes: [8, 10, 4, 8]}
train:
  n_iter: 3000
  lr: 0.001
  n_warmup: 500
  lr_decay_every: 1000
  clip_grad: 10.0
output:
  checkpoint_every: 500
  history_every: 50
  log_every: 250
  num_threads: 1
  device: cuda
