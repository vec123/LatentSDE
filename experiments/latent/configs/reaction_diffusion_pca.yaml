# Reaction-diffusion (test_data/scripts/reaction_diffusion), SDE-matching type posterior (SequencePosterior)
# over a PCA frame encoder/decoder fit once ahead of time (test_data/scripts/reaction_diffusion/fit_pca.py).
name: reaction_diffusion_pca
seed: 0
data:
  train:
    path: test_data/data/reaction_diffusion/reaction_diffusion_batch.h5
    field: u
    length: 1000
    n_groups: 10   # 20 windows (10 trajectories x 2 each) / 10 groups = 2 windows (B) per training step
  val:
    path: test_data/data/reaction_diffusion/reaction_diffusion_val.h5
    field: u
    length: 1000
    n_groups: 1    # 2 windows (2 trajectories x 1 each), evaluated together
  test:
    path: test_data/data/reaction_diffusion/reaction_diffusion_test.h5
    field: u
    length: 1000
    n_groups: 1
model:
  dim_z: 4
  encoder:
    type: pca
    model_path: test_data/data/reaction_diffusion/PCA/model.pt
  decoder:
    type: pca
  posterior:
    hidden: 32
  drift:
    hidden: [64, 64]
  diffusion:
    type: constant
  n_samples: 4
  n_quad: 16
train:
  n_iter: 1000
  lr: 1.0e-3
  n_warmup: 200
  lr_decay_every: 500
  log_every: 50
output:
  checkpoint_every: 500
  history_every: 10
  log_every: 50
evaluate:
  n_snapshots: 4
